name: 部署静态站点到 GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 准备站点产物
        run: |
          mkdir -p _site
          cp -R *.html *.xml robots.txt .nojekyll assets _site/
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
